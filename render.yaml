# One-click backend deploy for Render (https://render.com).
# Gives the API a public HTTPS URL + a managed Postgres — required before
# publishing the app (phones can't reach your Mac). See MOBILE.md.
#
# Deploy: push to GitHub → Render → New → Blueprint → pick this repo.
# Then set ANTHROPIC_API_KEY (and OAuth secrets) in the dashboard, and map the
# custom domain  api.myginnie.life  to this service (Render → Settings → Custom Domains).

services:
  - type: web
    name: myginnie-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pin Python 3.12 — 3.13 lacks wheels for pydantic/psycopg2 and fails the build
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: myginnie-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FRONTEND_URL
        value: https://myginnie.life
      - key: CORS_ORIGIN_REGEX
        value: "https://(.*\\.)?myginnie\\.life"

databases:
  - name: myginnie-db
    databaseName: myginnie
    plan: free
