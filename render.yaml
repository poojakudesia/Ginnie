# One-click backend deploy for Render (https://render.com).
# Gives the API a public HTTPS URL + a managed Postgres — required before
# publishing the app (phones can't reach your Mac). See MOBILE.md.
#
# Deploy: push to GitHub → Render → New → Blueprint → pick this repo.
# Then set ANTHROPIC_API_KEY (and OAuth secrets) in the dashboard.

services:
  - type: web
    name: dreamlife-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dreamlife-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FRONTEND_URL
        value: https://localhost
      - key: CORS_ORIGIN_REGEX
        value: "https://.*"  # tighten to your web domain in production

databases:
  - name: dreamlife-db
    databaseName: dreamlife
    plan: free
